version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Database Service
  # --------------------------------------------------------------------------
  db_postgres:
    image: postgres:16-alpine
    container_name: library_db_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/init_users.sql:/docker-entrypoint-initdb.d/02_users.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Redis In-Memory Cache Service
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: library_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 3. High-Performance Decoupled Async API Backend (FastAPI + Uvicorn)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: library_api_backend
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-20}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-100}

    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 4. Medallion ETL Pipeline Worker (Scheduled Execution Every 1-2 Mins)
  # --------------------------------------------------------------------------
  pipeline_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: library_pipeline_worker
    restart: always
    command: python pipelines/etl_medallion.py --interval-seconds 90
    env_file: .env
    environment:
      POSTGRES_HOST: db_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db_postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 5. Django Web UI Service
  # --------------------------------------------------------------------------
  django_web:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: library_django_web
    restart: always
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      POSTGRES_HOST: db_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
    depends_on:
      db_postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
